
name: Build IRIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract IRIS project
        run: |
          unzip -q IRIS_Android_Mobile_Cloud_Build.zip -d extracted
          ls extracted/IRIS_Android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
           packages: 'platform-tools'


      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: extracted/IRIS_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-APK
          path: extracted/IRIS_Android/app/build/outputs/apk/debug/app-debug.apk
